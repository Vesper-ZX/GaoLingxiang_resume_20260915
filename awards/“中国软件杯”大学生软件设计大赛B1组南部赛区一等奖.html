<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>“中国软件杯”大学生软件设计大赛B1组南部赛区一等奖</title>
<style>
    /* ===== 内嵌个性化字体 ===== */
    @font-face {
        font-family: 'Smiley Sans';
        src: url('../fonts/SmileySans-Oblique.subset.woff2') format('woff2');
        font-weight: 100 900; font-style: normal; font-display: swap;
    }
    @font-face {
        font-family: 'LXGW WenKai';
        src: url('../fonts/LXGWWenKai-Regular.subset.woff2') format('woff2');
        font-weight: 400; font-style: normal; font-display: swap;
    }
    .back-btn, .award-title {
        font-family: 'Smiley Sans', 'LXGW WenKai', "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'LXGW WenKai', "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        background: #f4f6fb; color: #1f2937; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        padding: 34px 18px 60px; line-height: 1.7;
    }
    .blob { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .34; z-index: -1; pointer-events: none; will-change: transform; }
    .blob-1 { width: 44vmax; height: 44vmax; top: -14%; left: -12%; background: #818cf8; animation: drift-1 24s ease-in-out infinite alternate; }
    .blob-2 { width: 38vmax; height: 38vmax; bottom: -14%; right: -10%; background: #f472b6; animation: drift-2 30s ease-in-out infinite alternate; }
    @keyframes drift-1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(10vw, 8vh) scale(1.18); } }
    @keyframes drift-2 { from { transform: translate(0, 0) scale(1.08); } to { transform: translate(-9vw, -8vh) scale(0.94); } }
    .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 22px; border-radius: 999px; text-decoration: none;
        color: #fff; font-weight: 600; font-size: .95rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 8px 22px rgba(99, 102, 241, .35);
        transition: transform .25s, box-shadow .25s;
        animation: fade-up .6s both;
    }
    .back-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(99, 102, 241, .45); }
    .award-title {
        margin: 22px 0 26px; max-width: 960px; text-align: center;
        font-size: clamp(1.15rem, 2.6vw, 1.6rem); line-height: 1.5;
        background: linear-gradient(90deg, #6366f1, #ec4899);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: fade-up .6s .15s both;
    }
    .img-card {
        max-width: 1000px; width: 100%; padding: 14px;
        background: rgba(255, 255, 255, .75); border: 1px solid rgba(99, 102, 241, .15);
        border-radius: 20px; backdrop-filter: blur(10px);
        box-shadow: 0 8px 30px rgba(31, 41, 55, .1);
        animation: fade-up .6s .3s both;
        transition: transform .3s, box-shadow .3s;
    }
    .img-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(99, 102, 241, .2); }
    .img-card img { display: block; width: 100%; height: auto; border-radius: 12px; cursor: zoom-in; }
    .tip { margin-top: 16px; font-size: .85rem; color: #6b7280; animation: fade-up .6s .45s both; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<a class="back-btn" href="../index.html">⬅️ 返回主页</a>
<h1 class="award-title">🥇 “中国软件杯”大学生软件设计大赛B1组南部赛区一等奖</h1>
<div class="img-card">
    <a href="../imgs/“中国软件杯”大学生软件设计大赛B1组南部赛区一等奖.png" target="_blank" title="查看原图">
        <img src="../imgs/“中国软件杯”大学生软件设计大赛B1组南部赛区一等奖.png" alt="“中国软件杯”大学生软件设计大赛B1组南部赛区一等奖">
    </a>
</div>
<p class="tip">🔍 点击图片可查看原图</p>
</body>
</html>
